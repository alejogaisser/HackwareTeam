; PlatformIO Project Configuration File
; Robot estilo WALL-E sobre ESP32
;
; Para subir el codigo:
;   1. Conectar el ESP32 por USB
;   2. En VS Code (con extension PlatformIO instalada): click en el icono de PlatformIO
;      -> Project Tasks -> esp32dev -> Upload
;   O desde la terminal: pio run --target upload

[env:esp32dev]
; Version fijada a proposito. Sin fijarla, PlatformIO baja la ultima y el dia
; que salga un core Arduino 3.x el proyecto deja de compilar: ledcSetup() y
; ledcAttachPin() no existen ahi (la API pasa a ledcAttach(pin, freq, res)).
platform = espressif32@7.1.1
board = esp32dev
; OJO si piensan pasar a ESP32-S3: no alcanza con cambiar el board. En el S3 no
; existen los GPIO 25/26/27, asi que hay que re-mapear los pines de main.cpp.
framework = arduino
; La etapa de audio no entra en la particion de app por defecto (1.3MB).
; huge_app deja 3MB para la aplicacion, a cambio de perder el OTA.
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.5
    madhephaestus/ESP32Servo @ ^1.1.1
    bblanchon/ArduinoJson @ ^6.21.3
    ; Servidor web asincronico + WebSockets, para el control desde el celular.
    ; Se usa el fork de esphome a proposito: los forks nuevos (ESP32Async /
    ; me-no-dev 3.6+) ya piden Arduino core 3.x, y este proyecto esta clavado
    ; en core 2.0.17 por el tema de ledcSetup(). Este fork es el ultimo que
    ; sigue compilando contra 2.x.
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    esphome/AsyncTCP-esphome @ ^2.1.4

; La libreria I2S del parlante y del microfono NO se agrega aca: driver/i2s.h y
; driver/adc.h vienen dentro del propio framework Arduino-ESP32 (son del IDF).

build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; El callback del WebSocket corre en la tarea de AsyncTCP, no en loop().
    ; Con la pila por defecto (8KB) el parseo de JSON mas TLS activo llega a
    ; desbordar. 16KB deja margen de sobra y solo cuesta RAM una vez.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=16384

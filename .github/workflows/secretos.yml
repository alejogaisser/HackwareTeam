# Frena cualquier push o pull request que traiga una API key, una contraseña
# real o el archivo secrets.h. El repo es publico: una key que llega aca hay que
# darla por perdida aunque se borre enseguida.
name: Chequeo de secretos

on:
  push:
  pull_request:

# Solo lectura: este job no necesita escribir nada en el repo.
permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      # Fijado por commit y no por etiqueta: una etiqueta se puede mover a otro
      # codigo, un commit no.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Buscar secretos
        run: python3 tools/check_secrets.py
